# Prueba local equivalente a Easypanel: docker compose up --build  →  http://localhost:8080
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: damac
      MYSQL_DATABASE: damac_acceso
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: damac
      DB_NAME: damac_acceso
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
    ports:
      - "8080:3000"
    depends_on:
      - mysql

volumes:
  mysql-data:
