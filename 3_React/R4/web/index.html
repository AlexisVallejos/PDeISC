    <title>Alexis Vallejos · Portfolio</title>
    <script>
      // Aplica el tema guardado antes de pintar: sin destello claro al recargar en modo oscuro.
      try {
        const guardado = JSON.parse(localStorage.getItem('tema'))
        const tema = guardado ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro')
        document.documentElement.setAttribute('data-tema', tema)
      } catch {}
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
